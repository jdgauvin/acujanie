title: "Acupuncture Janie Couture"
description: "Clinique d'acupuncture à Québec - Charlesbourg-Beauport. Traitements pour douleurs, stress, allergies, fertilité et plus."
url: "https://acujanie.com"
baseurl: ""
lang: "fr-CA"

# SEO
logo: /assets/images/logo_sun.png
image: https://acujanie.com/assets/images/logo_sun.png
author:
  name: Janie Couture
social:
  name: Acupuncture Janie Couture
  links:
    - https://www.facebook.com/JanieCoutureAcupuncture
# google_site_verification: ""

permalink: /articles/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Janie Couture"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-feed

sass:
  style: compressed

contact:
  phone: "581-991-8654"
  email: "info@acujanie.com"
  address: "1480 Boulevard Louis-XIV, Local 103"
  city: "Québec, QC G2L 1M3"
  area: "Charlesbourg - Beauport"
  hours: "Lundi-Vendredi: 8h30 - 20h30"
  facebook: "https://www.facebook.com/JanieCoutureAcupuncture"
  price: "75$"

# Online booking comes from MemoDing, which keeps the clinic's agenda and sends the reminders
memoding_url: "https://acupuncture-janie-couture.memoding.com"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
