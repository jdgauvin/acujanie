<!DOCTYPE html>
<html lang="{{ site.lang | default: 'fr-CA' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  {% seo %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <link rel="icon" type="image/png" href="{{ '/assets/images/logo_sun.png' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  {% if page.schema %}
  <script type="application/ld+json">
  {{ page.schema | jsonify }}
  </script>
  {% endif %}

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Acupuncture Janie Couture",
    "image": "{{ '/assets/images/logo_sun.png' | absolute_url }}",
    "telephone": "{{ site.contact.phone }}",
    "email": "{{ site.contact.email }}",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "{{ site.contact.address }}",
      "addressLocality": "Québec",
      "addressRegion": "QC",
      "postalCode": "G2L 1M3",
      "addressCountry": "CA"
    },
    "openingHours": "Mo-Fr 08:30-20:30",
    "priceRange": "$$",
    "url": "{{ site.url }}"
  }
  </script>
</head>
<body>
  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
