<!DOCTYPE html>
<html lang="{{ site.lang | default: 'fr-CA' }}">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NZY2C5RN9R"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NZY2C5RN9R');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  {% feed_meta %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/logo_sun-small.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/logo_sun-small.png' | relative_url }}">

  {% if page.schema %}
  <script type="application/ld+json">
  {{ page.schema | jsonify }}
  </script>
  {% endif %}

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "HealthAndBeautyBusiness",
    "@id": "{{ site.url }}/#business",
    "name": "Acupuncture Janie Couture",
    "description": "{{ site.description }}",
    "image": "{{ '/assets/images/logo_sun.png' | absolute_url }}",
    "telephone": "{{ site.contact.phone }}",
    "email": "{{ site.contact.email }}",
    "url": "{{ site.url }}",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "{{ site.contact.address }}",
      "addressLocality": "Québec",
      "addressRegion": "QC",
      "postalCode": "G2L 1M3",
      "addressCountry": "CA"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 46.8615,
      "longitude": -71.2437
    },
    "areaServed": {
      "@type": "City",
      "name": "Québec"
    },
    "sameAs": [
      "{{ site.contact.facebook }}"
    ],
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
      "opens": "08:30",
      "closes": "20:30"
    },
    "priceRange": "$$"
  }
  </script>

  <script async src="https://cdn01.basis.net/assets/up.js?um=1" onload="cntrUpTag.track('cntrData','28aca3e0c854a4dc');"></script>

  <!--<script async src="https://t.trafficforensics.com/tracker.js" data-api-key="tq_live_3IUCMw9m94kbODuxyeNPrluWyVtzo_ag" data-endpoint="https://t.trafficforensics.com"></script>-->
</head>
<body>
  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
